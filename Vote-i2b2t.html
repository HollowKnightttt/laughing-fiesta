<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vote | Minecraft Server</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
        }
    </style>
</head>
<body class="text-slate-200 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-6 sm:p-8 shadow-xl text-center">
        <!-- Header Icon -->
        <div class="w-14 h-14 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-2xl flex items-center justify-center mx-auto mb-5 text-2xl">
            <i class="fa-solid fa-check-to-slot"></i>
        </div>

        <!-- Title & Description -->
        <h1 class="text-2xl font-bold text-white mb-2">Vote for Our Server</h1>
        <p class="text-slate-400 text-sm mb-6 leading-relaxed">
            Support the server by voting on the list sites below. Your votes help us reach more players!
        </p>

        <!-- Vote Links -->
        <div class="space-y-3">
            <a href="https://minecraft.buzz/vote/indonesia-2builders2tools" 
               target="_blank" 
               rel="noopener noreferrer" 
               class="flex items-center justify-between bg-slate-800 hover:bg-slate-700/80 border border-slate-700 text-white font-medium p-4 rounded-xl transition-all group">
                <span class="flex items-center gap-3">
                    <i class="fa-solid fa-cube text-emerald-400"></i>
                    <span>Vote Option #1</span>
                </span>
                <i class="fa-solid fa-arrow-right text-xs text-slate-400 group-hover:translate-x-1 group-hover:text-emerald-400 transition-all"></i>
            </a>

            <a href="https://minecraftpocket-servers.com/server/133718/vote/" 
               target="_blank" 
               rel="noopener noreferrer" 
               class="flex items-center justify-between bg-slate-800 hover:bg-slate-700/80 border border-slate-700 text-white font-medium p-4 rounded-xl transition-all group">
                <span class="flex items-center gap-3">
                    <i class="fa-solid fa-mobile-screen text-emerald-400"></i>
                    <span>Vote Option #2</span>
                </span>
                <i class="fa-solid fa-arrow-right text-xs text-slate-400 group-hover:translate-x-1 group-hover:text-emerald-400 transition-all"></i>
            </a>
        </div>

        <!-- Footer Notice -->
        <p class="text-xs text-slate-500 mt-6">
            You can vote once every 24 hours per link.
        </p>
    </div>

</body>
</html>
